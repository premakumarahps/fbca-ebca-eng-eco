<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <!-- Outer Shield Ring -->
  <rect x="5" y="5" width="90" height="90" rx="22" stroke="url(#ecoGrad)" stroke-width="3" fill="#0b1329" fill-opacity="0.9" />
  
  <!-- Ferrocement Reinforcement Wire Grid -->
  <path d="M20 30H80M20 45H80M20 60H80M20 75H80" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2" />
  <path d="M30 20V80M45 20V80M60 20V80M75 20V80" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="2 2" />

  <!-- Solar Sun Ray Center & PV Diamond -->
  <polygon points="50,16 62,28 50,40 38,28" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5" />
  <circle cx="50" cy="28" r="4" fill="#fbbf24" />

  <!-- Economic Benefit-Cost Growth Curve -->
  <path d="M22 74 Q 40 70 52 50 T 80 26" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="drop-shadow(0 0 8px rgba(16,185,129,0.5))" />
  
  <!-- Cash Flow Data Nodes -->
  <circle cx="22" cy="74" r="3.5" fill="#10b981" />
  <circle cx="44" cy="62" r="3.5" fill="#06b6d4" />
  <circle cx="62" cy="38" r="3.5" fill="#f59e0b" />
  <circle cx="80" cy="26" r="4.5" fill="#34d399" stroke="#ffffff" stroke-width="1.5" />

  <!-- Currency / Delta Emblem Accent -->
  <path d="M30 48L36 40L42 48" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
